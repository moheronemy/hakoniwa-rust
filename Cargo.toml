[workspace]
resolver = "3"
members = ["crates/hakoniwa-core", "crates/hakoniwa-server", "crates/hako-convert"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
hakoniwa-core = { path = "crates/hakoniwa-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
encoding_rs = "0.8"
rand = "0.8"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
flate2 = "1"
